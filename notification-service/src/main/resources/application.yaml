server:
  port: 8087

spring:
  application:
    name: notification-service

  config:
    import: optional:configserver:http://localhost:8888

  datasource:
    url: jdbc:mysql://localhost:3306/healthcare_notification_db
    username: root
    password: Naveen@001
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true

    open-in-view: false

  kafka:
    bootstrap-servers: localhost:9092

    consumer:
      group-id: notification-service-group
      auto-offset-reset: earliest
      enable-auto-commit: false

      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

    listener:
      ack-mode: record
      missing-topics-fatal: false

    properties:
      spring:
        json:
          trusted:
            packages: com.naveen.healthcare.notificationservice.dto.event

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true

    service-url:
      defaultZone: http://localhost:8761/eureka/

  instance:
    prefer-ip-address: true

jwt:
  secret: 12345678901234567890123456789012345678901234567890

notification:
  kafka:
    topics:
      appointment-events: healthcare.appointment.events
      claim-events: healthcare.claim.events
      insurance-events: healthcare.insurance.events

    dead-letter-topics:
      appointment-events: healthcare.appointment.events.DLT
      claim-events: healthcare.claim.events.DLT
      insurance-events: healthcare.insurance.events.DLT

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info

  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    org.springframework.kafka: INFO
    org.apache.kafka: WARN
    org.springframework.security: INFO
    com.naveen.healthcare.notificationservice: DEBUG