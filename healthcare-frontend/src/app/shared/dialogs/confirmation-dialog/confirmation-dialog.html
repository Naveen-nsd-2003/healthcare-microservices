<section
  class="dialog-shell"
  [class.dialog-shell--warning]="dialogType === 'warning'"
  [class.dialog-shell--danger]="dialogType === 'danger'"
>
  <div class="dialog-icon-wrapper">
    <mat-icon>
      {{ iconName }}
    </mat-icon>
  </div>

  <div class="dialog-copy">
    <h2 class="dialog-title">
      {{ data.title }}
    </h2>

    <p class="dialog-message">
      {{ data.message }}
    </p>
  </div>

  <div class="dialog-actions">
    <button
      mat-button
      type="button"
      class="cancel-button"
      (click)="cancel()"
    >
      {{ cancelButtonText }}
    </button>

    <button
      mat-flat-button
      type="button"
      class="confirm-button"
      (click)="confirm()"
    >
      <mat-icon>
        {{ iconName }}
      </mat-icon>

      <span>
        {{ confirmButtonText }}
      </span>
    </button>
  </div>
</section>
