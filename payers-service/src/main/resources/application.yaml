server:
  port: 8082

spring:
  application:
    name: payers-service

  config:
    import: optional:configserver:http://localhost:8888

  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 5000
            readTimeout: 5000

  datasource:
    url: jdbc:mysql://localhost:3306/healthcare_payer_db
    username: root
    password: ${PAYER_DB_PASSWORD:Naveen@001}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true
    open-in-view: false

    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3

      properties:
        enable.idempotence: true
        delivery.timeout.ms: 120000
        request.timeout.ms: 30000
        max.in.flight.requests.per.connection: 5

insurance:
  kafka:
    topics:
      insurance-events: healthcare.insurance.events
      organization-events: healthcare.organization.events

  outbox:
    publisher:
      fixed-delay-ms: 2000
      batch-size: 50
      maximum-retries: 10
      initial-retry-delay-seconds: 5
      maximum-retry-delay-seconds: 3600
      processing-timeout-seconds: 300
      send-timeout-seconds: 30

  policy-expiration:
    cron: "0 5 0 * * *"
    zone: "Asia/Kolkata"

platform:
  admin:
    notification-email: ${PLATFORM_ADMIN_NOTIFICATION_EMAIL:admin@healthcare-test.local}

resilience4j:
  retry:
    instances:
      memberVerification:
        max-attempts: 3
        wait-duration: 2s

  circuitbreaker:
    instances:
      memberVerification:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

    register-with-eureka: true
    fetch-registry: true

  instance:
    prefer-ip-address: true

jwt:
  secret: ${JWT_SECRET:12345678901234567890123456789012345678901234567890}

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info

  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    org.springframework.security: INFO
    org.springframework.kafka: INFO
    org.apache.kafka: WARN
    com.naveen.healthcare.payersservice: DEBUG